<section
  class="blog-detail-page"
  *ngIf="blog"
>

  <!-- Hero -->
  <header class="blog-detail-header">
    <div class="container">

      <a
        routerLink="/blog"
        class="blog-detail-back"
      >
        ← Back to What's on Orlena
      </a>

      <span class="blog-detail-category">
        {{ blog.category }}
      </span>

      <h1 class="blog-detail-title">
        {{ blog.title }}
      </h1>

    </div>
  </header>


  <!-- Featured Image -->
  <section class="blog-detail-featured">
    <div class="container">

      <div class="blog-detail-image">
        <img
          [src]="blog.image"
          [alt]="blog.title"
        />
      </div>

    </div>
  </section>


  <!-- Article -->
  <article class="blog-detail-article">
    <div class="container">

      <div class="blog-detail-content">

        <ng-container
          *ngFor="let paragraph of blog.paragraphs; let i = index"
        >

          <h2
            *ngIf="blog.subheading && i === 1"
            class="blog-detail-subheading"
          >
            {{ blog.subheading }}
          </h2>

          <p class="blog-detail-paragraph">
            {{ paragraph }}
          </p>

        </ng-container>

      </div>

    </div>
  </article>


  <!-- Back -->
  <div class="blog-detail-footer">
    <div class="container">

      <a
        routerLink="/blog"
        class="blog-detail-back-button"
      >
        ← Back to What's on Orlena
      </a>

    </div>
  </div>

</section>


<!-- Article Not Found -->
<section
  class="blog-not-found"
  *ngIf="!blog"
>
  <div class="container">

    <h1>Blog not found</h1>

    <a routerLink="/blog">
      Back to What's on Orlena
    </a>

  </div>
</section>
